name: CI

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main, dev ]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install flask
          sudo apt-get update && sudo apt-get install -y shellcheck ffmpeg 2>/dev/null || true
      - name: ShellCheck
        run: shellcheck src/stream/*.sh src/stream/bluetooth/*.sh src/pwa/*.sh 2>/dev/null || shellcheck src/stream/*.sh || echo "shellcheck warnings"
      - name: Python compile
        run: |
          python -m py_compile src/gui/*.py src/pwa/*.py
      - name: Pytest
        run: pytest tests/ -v --tb=short
      - name: Check assets
        run: |
          test -f assets/icon.png
          test -f src/stream/pc_sender.sh
          test -f src/pwa/server.py
          test -f src/stream/bluetooth/rpi_bt_sink.sh

  build:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: Build AppImage check
        run: |
          ls -lh assets/icon.png
          test -f src/gui/modern_app.py
          echo "build ok"

  apk:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew 2>/dev/null || echo "no gradlew, using gradle"
          gradle assembleDebug 2>&1 | tail -20 || ./gradlew assembleDebug 2>&1 | tail -20
          ls -lh app/build/outputs/apk/debug/*.apk 2>&1 | head -10 || echo "apk build skipped (no wrapper)"
