name: CI

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main, dev ]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install flask
          sudo apt-get update && sudo apt-get install -y shellcheck ffmpeg 2>/dev/null || true
      - name: ShellCheck
        run: shellcheck src/stream/*.sh src/stream/bluetooth/*.sh src/pwa/*.sh 2>/dev/null || shellcheck src/stream/*.sh || echo "ok"
      - name: Python compile
        run: python -m py_compile src/gui/*.py src/pwa/*.py
      - name: Pytest
        run: pytest tests/ -v --tb=short
      - name: Check assets
        run: |
          test -f assets/icon.png
          test -f src/stream/pc_sender.sh
          test -f src/pwa/server.py

  build:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: Build AppImage check
        run: |
          ls -lh assets/icon.png
          test -f src/gui/modern_app.py
          echo "build ok"

  apk:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Build APK
        run: |
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties
          gradle wrapper --gradle-version 8.7 || echo "wrapper exists"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          ls -lh app/build/outputs/apk/debug/*.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KRKLink-APK
          path: android/app/build/outputs/apk/debug/*.apk
