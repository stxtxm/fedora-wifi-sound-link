monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source hfp_hf hsp_hs hfp_ag hsp_ag ]
  bluez5.codecs = [ sbc sbc_xq aac opus ]
}

monitor.bluez.rules = [
  {
    matches = [ { device.name = "~bluez_card.*" } ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ a2dp_sink ]
      }
    }
  }
]
